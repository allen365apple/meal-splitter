    <link rel="manifest" href="manifest.webmanifest">

</head>
<body>
    <div id="root"></div>

    <!-- 載入失敗時的提示，避免整頁空白又沒有任何訊息 -->
    <div id="boot-error" style="display:none;max-width:24rem;margin:15vh auto;padding:1.5rem;font-family:system-ui,-apple-system,sans-serif;text-align:center;color:#334155">
        <div style="font-size:2.5rem">📡</div>
        <h1 style="font-size:1.125rem;font-weight:700;margin:.75rem 0 .5rem">載入失敗 / Failed to load</h1>
        <p style="font-size:.875rem;line-height:1.7;color:#64748b;margin:0 0 1.25rem">
            請確認網路連線後重新整理。<br>Please check your connection and reload.
        </p>
        <button onclick="location.reload()" style="width:100%;padding:.75rem;border:0;border-radius:.75rem;background:#10b981;color:#fff;font-weight:700;font-size:1rem">重新載入 / Reload</button>
    </div>

    <script src="app.js?v=1d6c7935" defer></script>
    <script>
        setTimeout(function () {
            var root = document.getElementById('root');
            if (!root || root.childElementCount === 0) {
                var box = document.getElementById('boot-error');
                if (box) box.style.display = 'block';
            }
        }, 4000);
    </script>
</body>
</html>
